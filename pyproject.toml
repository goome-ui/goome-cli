[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "goome-cli"
dynamic = ["version"]
description = "goome new, makes a new goome project from a template"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
authors = [{ name = "sevvy-wevvy" }]

[project.urls]
Homepage = "https://github.com/goome-ui/goome-cli"
Docs = "https://goome-ui.github.io/docs/"

[project.scripts]
goome = "goome_cli:main"

[tool.hatch.version]
path = "goome.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"goome.py" = "goome_cli.py"

[tool.hatch.build.targets.sdist]
include = ["goome.py", "LICENSE", "README.md", "pyproject.toml"]
