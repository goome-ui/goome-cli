[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "goome-cli"
dynamic = ["version"]
description = "goome new makes a new goome project from a template, goome build --web puts an app in the browser. One file, no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
authors = [{ name = "sevvy-wevvy" }]
keywords = ["goome", "cli", "project template", "overlay", "scaffolding", "webassembly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: User Interfaces",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/goome-ui/goome-cli"
Documentation = "https://goome-ui.github.io/docs/"
Issues = "https://github.com/goome-ui/goome-cli/issues"
Changelog = "https://github.com/goome-ui/goome-cli/releases"
"C library" = "https://github.com/goome-ui/c-goome"

[project.scripts]
goome = "goome_cli:main"

[tool.hatch.version]
path = "goome.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"goome.py" = "goome_cli.py"

[tool.hatch.build.targets.sdist]
include = ["goome.py", "LICENSE", "README.md", "pyproject.toml"]
